name: invoice_maker
description: Simple offline invoices and expenses for self-employed people in Germany
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State & storage
  provider: ^6.1.1
  get: ^4.6.6
  shared_preferences: ^2.2.2

  # PDF
  pdf: ^3.10.4
  printing: ^5.11.0

  # Files & images
  file_picker: ^13.1.0
  image_picker: ^1.0.4

  # Contacts import (Android only)
  flutter_contacts: ^1.1.7+1
  permission_handler: ^11.0.1

  # Utilities
  intl: ^0.18.1
  uuid: ^4.1.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
