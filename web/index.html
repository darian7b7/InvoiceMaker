<!DOCTYPE html>
<!-- translate="no": browser auto-translation breaks Flutter's rendering. -->
<html lang="de" translate="no">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Create and manage professional invoices, offline.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Invoice Maker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Invoice Maker</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* The app is a phone-width column centered by the browser; the sides
       use the same grey as the app's background edges. */
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #F1F5F9;
    }
    #app {
      max-width: 600px;
      height: 100%;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // The printing package loads pdf.js (v3.2.146) for the PDF preview from
    // unpkg.com by default; Firefox's strict tracking protection blocks that.
    // Serve the copy in web/pdfjs/ from our own domain instead.
    window.dartPdfJsBaseUrl = "pdfjs/";
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
